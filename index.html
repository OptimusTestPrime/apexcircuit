<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A 3D browser racing game with lap timing, a best-lap ghost and touch or keyboard controls.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Apex Circuit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D chase view with glass HUD: lap panel top-left, speed/rpm/gear top-centre, buttons + minimap top-right, thumb pads bottom corners. */
:root {
  color-scheme: dark;
  --sky: #b9cde0;
  --glass: rgba(255, 255, 255, 0.2);
  --glass-edge: rgba(255, 255, 255, 0.4);
  --ink: #ffffff;
  --ink-dim: rgba(255, 255, 255, 0.76);
  --accent: #ffa629;
  --rpm: #3db4ff;
  --rpm-hot: #ff5a4a;
  --panel: rgba(16, 26, 44, 0.82);
  --u: clamp(3.6px, min(1vw, 1.6vh), 8px);
  --pad: max(16px, calc(var(--u) * 2.6));
  --key: max(48px, calc(var(--u) * 12.5));
  --font: 'Saira Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  position: relative;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--font);
  overscroll-behavior: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#app {
  position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--sky);
  --pad: max(16px, calc(var(--u) * 2.6));
  --key: max(48px, calc(var(--u) * 12.5));
}
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.glass {
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(10px) saturate(1.25);
  backdrop-filter: blur(10px) saturate(1.25);
  border-radius: calc(var(--u) * 3);
  box-shadow: 0 calc(var(--u) * 0.6) calc(var(--u) * 2.4) rgba(20, 40, 70, 0.25);
}
.hud, .hud * { text-shadow: 0 1px 3px rgba(10, 30, 60, 0.45); }
.hud { position: absolute; inset: 0; padding: var(--pad); pointer-events: none; }
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: calc(var(--u) * 2); }
.left { display: flex; gap: calc(var(--u) * 2); align-items: flex-start; min-width: 0; }
.center { display: flex; gap: calc(var(--u) * 2); align-items: flex-start; justify-content: center; }
.right { display: flex; flex-direction: column; align-items: flex-end; gap: calc(var(--u) * 2); }
.right .row { display: flex; gap: calc(var(--u) * 2); }

.fps {
  background: #0d1a2c; color: #6ae6ee; border: 1px solid #1a3350;
  width: calc(var(--u) * 14); font: 600 calc(var(--u) * 1.9) / 1.2 var(--font);
  padding: 0; text-shadow: none; flex: none;
}
.fps span { display: block; padding: calc(var(--u) * 0.5) calc(var(--u) * 0.8); white-space: nowrap; }
.fps canvas { display: block; width: 100%; height: calc(var(--u) * 5.2); }
.fps[hidden] { display: none !important; }

.lap { width: calc(var(--u) * 38); padding: calc(var(--u) * 1.6) calc(var(--u) * 2.4) calc(var(--u) * 1.8); flex: none; }
.lap .cols { display: grid; grid-template-columns: 1fr 1px 1fr; gap: calc(var(--u) * 1.6); text-align: center; align-items: center; }
.lap .sep { width: 1px; height: 80%; background: var(--glass-edge); }
.lap .lbl { font-size: calc(var(--u) * 3); color: var(--ink-dim); font-weight: 500; letter-spacing: 0.02em; }
.lap .val { font-size: calc(var(--u) * 4.6); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
.lap .bar { margin-top: calc(var(--u) * 1.4); height: calc(var(--u) * 0.9); border-radius: 99px; background: rgba(20, 24, 40, 0.55); overflow: hidden; }
.lap .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; }

.speed { text-align: center; width: calc(var(--u) * 28); }
.speed .num { font-size: calc(var(--u) * 7.4); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.speed .tank { margin: calc(var(--u) * 1) auto calc(var(--u) * 1.2); width: 86%; height: calc(var(--u) * 1.7); border-radius: 99px; overflow: hidden;
  background: linear-gradient(90deg, rgba(22, 26, 44, 0.62) 0 87%, rgba(84, 24, 34, 0.9) 87%); }
.speed .tank i { display: block; height: 100%; width: 12%; background: var(--rpm); border-radius: 99px; }
.speed .tank i.hot { background: var(--rpm-hot); }
.speed .rpm { font-size: calc(var(--u) * 3.1); color: var(--ink-dim); font-variant-numeric: tabular-nums; }

.gear { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 0.8); }
.gear .box { width: calc(var(--u) * 10); height: calc(var(--u) * 10); display: grid; place-items: center; font-size: calc(var(--u) * 5.2); font-weight: 600; }
.gear .mode { font-size: calc(var(--u) * 3); color: var(--ink-dim); }

.btn { pointer-events: auto; width: calc(var(--u) * 10); height: calc(var(--u) * 10); min-width: 44px; min-height: 44px; display: grid; place-items: center; padding: 0; color: var(--ink); cursor: pointer; font: inherit; }
.btn svg { width: 46%; height: 46%; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
.btn:active { background: rgba(255, 255, 255, 0.36); }
.btn:focus-visible, .key:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#mini { width: calc(var(--u) * 30); height: calc(var(--u) * 30); display: block; }

.touch { display: none; }
@media (pointer: coarse) { .touch { display: flex; } .kbhint { display: none !important; } }
.pad { position: absolute; bottom: var(--pad); display: flex; gap: calc(var(--u) * 2); pointer-events: none; }
.pad.l { left: var(--pad); flex-direction: column; }
.pad.r { right: var(--pad); }
.key { pointer-events: auto; width: var(--key); height: var(--key); display: grid; place-items: center; padding: 0; color: var(--ink); touch-action: none; cursor: pointer; }
.key svg { width: 42%; height: 42%; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
.key.on { background: rgba(255, 255, 255, 0.42); transform: scale(0.96); }

.toast { position: absolute; left: 50%; top: calc(var(--pad) + var(--u) * 17); transform: translateX(-50%); padding: calc(var(--u) * 1.2) calc(var(--u) * 3); border-radius: 99px; font-size: calc(var(--u) * 3.6); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; opacity: 0; transition: opacity 0.25s; }
.toast.show { opacity: 1; }
.toast b { color: var(--accent); font-weight: 700; margin-left: 0.5em; }

.hint { position: absolute; left: 50%; bottom: calc(var(--pad) + var(--u) * 4); transform: translateX(-50%); padding: calc(var(--u) * 1.2) calc(var(--u) * 3); border-radius: 99px; font-size: calc(var(--u) * 3.4); font-weight: 500; text-align: center; max-width: calc(100% - 2 * var(--pad)); transition: opacity 0.3s; }
.hint[hidden] { display: none !important; }
.hint.kbhint { display: block; }
.touchhint { display: none; }
@media (pointer: coarse) { .touchhint { display: inline; } .keyhint { display: none; } }

.sheet { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10, 20, 36, 0.5); padding: var(--pad); z-index: 5; }
.sheet[hidden] { display: none !important; }
.panel { width: min(100%, 420px); background: var(--panel); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 16px; padding: 18px 20px 20px; font-size: 16px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); max-height: 100%; overflow: auto; }
.panel h2 { margin: 0 0 10px; font-size: 22px; font-weight: 600; letter-spacing: 0.02em; text-wrap: balance; }
.panel .row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 9px 0; border-top: 1px solid rgba(255, 255, 255, 0.1); }
.panel .row small { display: block; color: var(--ink-dim); font-size: 13px; }
.panel label { min-width: 0; }
.panel input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.panel select { font: inherit; background: rgba(255, 255, 255, 0.12); color: var(--ink); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 8px; padding: 6px 8px; }
.panel select option { color: #111; }
.panel .done { margin-top: 14px; width: 100%; font: inherit; font-weight: 600; padding: 10px; border-radius: 10px; border: 0; background: var(--accent); color: #2a1800; cursor: pointer; text-shadow: none; }
.panel * { text-shadow: none; }

/* Portrait layout: lap and speed stack on the left, buttons and a smaller map on the right. */
#app[data-layout="port"] .fps { display: none; }
#app[data-layout="port"] .top { grid-template-columns: 1fr auto; grid-template-areas: "lap right" "center right"; row-gap: calc(var(--u) * 2); }
#app[data-layout="port"] .left { grid-area: lap; }
#app[data-layout="port"] .center { grid-area: center; justify-content: flex-start; gap: calc(var(--u) * 1.6); }
#app[data-layout="port"] .right { grid-area: right; gap: calc(var(--u) * 1.4); }
#app[data-layout="port"] .right .row { gap: calc(var(--u) * 1.2); flex-wrap: wrap; justify-content: flex-end; max-width: calc(var(--u) * 16.2); }
#app[data-layout="port"] .btn { width: calc(var(--u) * 7.4); height: calc(var(--u) * 7.4); }
#app[data-layout="port"] #mini { width: calc(var(--u) * 18); height: calc(var(--u) * 18); }
#app[data-layout="port"] .lap { width: 100%; flex: 1; min-width: 0; padding: calc(var(--u) * 1.4) calc(var(--u) * 2); }
#app[data-layout="port"] .lap .cols { display: flex; flex-direction: column; gap: calc(var(--u) * 0.3); text-align: left; }
#app[data-layout="port"] .lap .cols > div:not(.sep) { display: flex; justify-content: space-between; align-items: baseline; gap: calc(var(--u) * 1.5); }
#app[data-layout="port"] .lap .sep { display: none; }
#app[data-layout="port"] .lap .lbl { font-size: calc(var(--u) * 3.3); }
#app[data-layout="port"] .lap .val { font-size: calc(var(--u) * 4); }
#app[data-layout="port"] .speed { width: calc(var(--u) * 18.5); }
#app[data-layout="port"] .speed .num { font-size: calc(var(--u) * 6.4); }
#app[data-layout="port"] .speed .tank { width: 100%; }
#app[data-layout="port"] .speed .rpm { font-size: calc(var(--u) * 2.8); }
#app[data-layout="port"] .gear .box { width: calc(var(--u) * 8); height: calc(var(--u) * 8); font-size: calc(var(--u) * 4.4); }
#app[data-layout="port"] .gear .mode { font-size: calc(var(--u) * 2.8); }
#app[data-layout="port"] .toast { top: calc(var(--pad) + var(--u) * 40); }
#app[data-layout="port"] .hint { bottom: calc(var(--pad) + var(--key) * 2 + var(--u) * 5); }
</style>

</head>
<body>
<main id="app">
  <canvas id="view" aria-label="Racing view"></canvas>

  <div class="hud">
    <div class="top">
      <div class="left">
        <div class="fps" id="fps"><span id="fpsText">60 FPS</span><canvas id="fpsGraph" width="112" height="36"></canvas></div>
        <section class="glass lap" aria-label="Lap times">
          <div class="cols">
            <div><div class="lbl" id="lapLbl">Lap 1</div><div class="val" id="lapTime">00:00.00</div></div>
            <div class="sep"></div>
            <div><div class="lbl">Best</div><div class="val" id="bestTime">--:--.--</div></div>
          </div>
          <div class="bar"><i id="lapBar"></i></div>
        </section>
      </div>

      <div class="center">
        <div class="speed" aria-label="Speed in kilometres per hour">
          <div class="num" id="spd">0</div>
          <div class="tank"><i id="rpmBar"></i></div>
          <div class="rpm" id="rpmTxt">1,000 rpm</div>
        </div>
        <div class="gear">
          <div class="glass box" id="gearBox">1</div>
          <div class="mode" id="gearMode">Auto</div>
        </div>
      </div>

      <div class="right">
        <div class="row">
          <button class="glass btn" id="btnRestart" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg></button>
          <button class="glass btn" id="btnLayout" aria-label="Switch between landscape and portrait layout" title="Switch layout"><svg viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="11" rx="1.6"/><path d="M4 17.5c2.4 2.6 13.6 2.6 16 0M17.4 15.3l2.6 2.2-3.2 1"/></svg></button>
          <button class="glass btn" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></svg></button>
        </div>
        <canvas id="mini" width="300" height="300" aria-label="Track map"></canvas>
      </div>
    </div>

    <div class="pad l touch">
      <button class="glass key" data-k="up" aria-label="Accelerate"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
      <button class="glass key" data-k="down" aria-label="Brake and reverse"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div class="pad r touch">
      <button class="glass key" data-k="left" aria-label="Steer left"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="glass key" data-k="right" aria-label="Steer right"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>

    <div class="glass toast" id="toast" role="status"></div>
    <div class="glass hint" id="hint">
      <span class="keyhint">Hold <b>&uarr;</b> or <b>W</b> to drive &middot; <b>&larr; &rarr;</b> steer &middot; <b>&darr;</b> brake &middot; <b>R</b> restart</span>
      <span class="touchhint">Hold the up key to start driving</span>
    </div>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="panel" role="dialog" aria-labelledby="setTitle">
      <h2 id="setTitle">Settings</h2>
      <div class="row"><label for="setLayout">Screen layout<small>Auto follows your phone. Landscape or Portrait turns the game to match, handy if rotation is locked.</small></label>
        <select id="setLayout"><option value="auto">Auto</option><option value="land">Landscape</option><option value="port">Portrait</option></select></div>
      <div class="row"><label for="setGhost">Ghost car<small>Replays your best lap in blue</small></label><input type="checkbox" id="setGhost"></div>
      <div class="row"><label for="setFps">Frame rate meter</label><input type="checkbox" id="setFps"></div>
      <div class="row"><label for="setSound">Engine sound</label><input type="checkbox" id="setSound"></div>
      <div class="row"><label for="setShadows">Shadows</label><input type="checkbox" id="setShadows"></div>
      <div class="row"><label for="setHq">Sharp rendering<small>Turn off if the game stutters</small></label><input type="checkbox" id="setHq"></div>
      <div class="row"><label for="setTrans">Gearbox<small>Manual shifts with Q and E on a keyboard</small></label>
        <select id="setTrans"><option value="auto">Auto</option><option value="manual">Manual</option></select></div>
      <div class="row"><label>Best lap<small id="bestInfo">No lap set yet</small></label></div>
      <button class="done" id="setDone">Back to the track</button>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  if (!window.THREE) {
    $('hint').textContent = 'The 3D engine could not load. Check your connection and reload the page.';
    return;
  }
  var app = $('app'), canvas = $('view');
  var TAU = Math.PI * 2;
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  var wrap = function (a) { a = a % TAU; if (a > Math.PI) a -= TAU; if (a < -Math.PI) a += TAU; return a; };

  /* ---------- settings ---------- */
  var S = { fps: true, sound: true, manual: false, shadows: true, hq: true, ghost: true, layout: 'auto' };
  try { Object.assign(S, JSON.parse(localStorage.getItem('apex.settings') || '{}')); } catch (e) {}
  function saveS() { try { localStorage.setItem('apex.settings', JSON.stringify(S)); } catch (e) {} }
  var best = null;
  try { var b0 = parseFloat(localStorage.getItem('apex.best')); if (b0 > 0) best = b0; } catch (e) {}

  /* ---------- renderer / scene ---------- */
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0xbccfe2);
  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xbccfe2, 170, 900);
  var camera = new THREE.PerspectiveCamera(62, 1, 0.4, 1600);

  // sky dome
  var skyGeo = new THREE.SphereGeometry(1200, 24, 12);
  (function () {
    var pa = skyGeo.attributes.position, cols = [];
    var top = new THREE.Color(0x5a83b5), hor = new THREE.Color(0xc4d5e5), c = new THREE.Color();
    for (var i = 0; i < pa.count; i++) {
      var t = clamp(pa.getY(i) / 1200, 0, 1);
      c.copy(hor).lerp(top, Math.pow(t, 0.55));
      cols.push(c.r, c.g, c.b);
    }
    skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  })();
  var sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
  sky.renderOrder = -10;
  scene.add(sky);

  // clouds
  (function () {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 4, 64, 64, 62);
    gr.addColorStop(0, 'rgba(255,255,255,0.95)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    var tex = new THREE.CanvasTexture(c);
    for (var i = 0; i < 16; i++) {
      var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.8, fog: false, depthWrite: false }));
      var a = Math.random() * TAU, r = 500 + Math.random() * 400;
      sp.position.set(Math.cos(a) * r + 260, 150 + Math.random() * 170, Math.sin(a) * r);
      sp.scale.set(260 + Math.random() * 220, 70 + Math.random() * 40, 1);
      scene.add(sp);
    }
  })();

  scene.add(new THREE.HemisphereLight(0xe2ecff, 0x6f7f66, 0.9));
  var sun = new THREE.DirectionalLight(0xfff1da, 0.95);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -34; sun.shadow.camera.right = 34; sun.shadow.camera.top = 34; sun.shadow.camera.bottom = -34;
  sun.shadow.camera.near = 10; sun.shadow.camera.far = 260;
  sun.shadow.bias = -0.0005;
  scene.add(sun); scene.add(sun.target);

  /* ---------- helper textures ---------- */
  function mk(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  var maxAniso = renderer.capabilities.getMaxAnisotropy();

  function asphaltTex() {
    var c = mk(512, 512), g = c.getContext('2d');
    g.fillStyle = '#4b4845'; g.fillRect(0, 0, 512, 512);
    for (var i = 0; i < 10000; i++) {
      var v = 68 + Math.random() * 46 | 0;
      g.fillStyle = 'rgba(' + v + ',' + (v - 2) + ',' + (v - 6) + ',0.35)';
      g.fillRect(Math.random() * 512, Math.random() * 512, 1 + Math.random() * 2, 1 + Math.random() * 2);
    }
    g.fillStyle = 'rgba(18,16,14,0.17)'; g.fillRect(140, 0, 80, 512); g.fillRect(292, 0, 80, 512);
    g.fillStyle = '#e9e6df';
    g.fillRect(20, 0, 12, 512); g.fillRect(480, 0, 12, 512);
    g.fillRect(250, 0, 12, 230);
    var t = new THREE.CanvasTexture(c);
    t.wrapT = THREE.RepeatWrapping; t.anisotropy = maxAniso;
    return t;
  }
  function checkerTex() {
    var c = mk(256, 64), g = c.getContext('2d');
    for (var x = 0; x < 8; x++) for (var y = 0; y < 2; y++) { g.fillStyle = (x + y) % 2 ? '#1c1c1e' : '#f4f3ef'; g.fillRect(x * 32, y * 32, 32, 32); }
    var t = new THREE.CanvasTexture(c); t.anisotropy = maxAniso; return t;
  }
  function boardTex(word, sub, c1, c2) {
    var c = mk(1024, 384), g = c.getContext('2d');
    var gr = g.createLinearGradient(0, 0, 1024, 384); gr.addColorStop(0, c1); gr.addColorStop(1, c2);
    g.fillStyle = gr; g.fillRect(0, 0, 1024, 384);
    g.fillStyle = 'rgba(255,255,255,0.92)';
    g.beginPath(); g.moveTo(90, 300); g.lineTo(190, 84); g.lineTo(260, 84); g.lineTo(160, 300); g.fill();
    g.beginPath(); g.moveTo(210, 300); g.lineTo(310, 84); g.lineTo(380, 84); g.lineTo(280, 300); g.fill();
    g.font = '700 150px "Saira Semi Condensed", Arial Narrow, sans-serif'; g.textBaseline = 'middle';
    g.fillText(word, 440, 160);
    g.font = '500 64px "Saira Semi Condensed", Arial Narrow, sans-serif'; g.fillStyle = 'rgba(255,255,255,0.8)';
    g.fillText(sub, 446, 276);
    var t = new THREE.CanvasTexture(c); t.anisotropy = maxAniso; return t;
  }
  function chevronTex(dir) {
    var c = mk(128, 128), g = c.getContext('2d');

      if (v >= -0.2) {
        var tq = 0.78 + 0.22 * Math.sin(clamp(r, 0, 1) * Math.PI);
        if (car.gear > 1 && r < 0.22) tq *= 0.35 + 3 * r;
        if (r >= 1.0) tq = 0;
        a = 14 * tq * (1 - Math.pow(Math.min(1, v / 84), 1.5));
      } else a = 30;
    } else if (dn) {
      if (v > 0.8) a = -40; else a = -7 * (1 - clamp(-v / 12, 0, 1));
    } else if (Math.abs(v) > 0) a = -Math.sign(v) * 2.2;
    if (Math.abs(v) > 0.05) a -= Math.sign(v) * (0.0005 * v * v + 0.25);
    if (offRoad && Math.abs(v) > 0.05) a -= Math.sign(v) * (9 + 0.02 * v * v);

    var nv = v + a * dt;
    if ((v > 0 && nv < 0 && !dn) || (v < 0 && nv > 0)) nv = 0;
    if (!up && !dn && Math.abs(nv) < 0.25) nv = 0;
    car.v = clamp(nv, -12, 90);
    car.lastA = a;

    // steering
    var av = Math.abs(car.v);
    var yawMax = av < 0.3 ? 0 : Math.min(av / 6, 30 / av);
    if (offRoad) yawMax *= 0.7;
    var yaw = yawMax * car.steer * (car.v >= 0 ? 1 : -1);
    car.h -= yaw * dt;
    car.v -= Math.sign(car.v) * 0.055 * Math.abs(yaw) * av * dt;
    car.yaw = yaw;

    car.x += Math.sin(car.h) * car.v * dt;
    car.z += Math.cos(car.h) * car.v * dt;

    // track relation
    var prev = car.idx;
    car.idx = nearest(car.x, car.z, car.idx, false);
    var rr = R[car.idx];
    car.d = (car.x - P[car.idx].x) * rr.x + (car.z - P[car.idx].z) * rr.z;
    if (Math.abs(car.d) > LIM) {
      var sg = Math.sign(car.d), ex = car.d - sg * LIM;
      car.x -= rr.x * ex; car.z -= rr.z * ex; car.d = sg * LIM;
      var nd = Math.sin(car.h) * rr.x * sg + Math.cos(car.h) * rr.z * sg;
      if (nd > 0 && car.v > 0) {
        car.v *= 1 - 0.55 * nd;
        car.h += wrap(HT[car.idx] - car.h) * Math.min(1, 5 * dt);
      }
    }
    if (prev > N * 0.85 && car.idx < N * 0.15 && car.v > 0) {
      if (passedHalf) { lapDone(); passedHalf = false; }
      else if (lap === 1) { lapT = 0; rec = []; nextRec = 0; gi = 0; ghostT = 0; }
    }
    if (car.idx > N * 0.5 && car.idx < N * 0.9) passedHalf = true;
    if (running) {
      lapT += dt;
      if (lapT >= nextRec) { rec.push(+lapT.toFixed(3), +car.x.toFixed(2), +car.z.toFixed(2), +car.h.toFixed(3)); nextRec = lapT + 1 / 30; }
    }
  }

  /* ---------- input ---------- */
  var audio = null;
  function initAudio() {
    if (audio) { if (audio.ac.state === 'suspended') audio.ac.resume(); return; }
    if (!S.sound) return;
    try {
      var ac = new (window.AudioContext || window.webkitAudioContext)();
      var o1 = ac.createOscillator(), o2 = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      o1.type = 'sawtooth'; o2.type = 'square'; f.type = 'lowpass'; g.gain.value = 0;
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(ac.destination); o1.start(); o2.start();
      audio = { ac: ac, o1: o1, o2: o2, f: f, g: g };
    } catch (e) { audio = null; }
  }
  function audioTick() {
    if (!audio) return;
    var t = audio.ac.currentTime, f = car.rpm / 60 * 3, on = S.sound && !paused;
    audio.o1.frequency.setTargetAtTime(f, t, 0.05); audio.o2.frequency.setTargetAtTime(f * 0.5, t, 0.05);
    audio.f.frequency.setTargetAtTime(300 + car.rpm * 0.35 + (keys.up ? 500 : 0), t, 0.08);
    audio.g.gain.setTargetAtTime(on ? 0.03 + (keys.up ? 0.05 : 0.015) : 0, t, 0.1);
  }
  document.addEventListener('visibilitychange', function () {
    if (!audio) return;
    if (document.hidden) audio.ac.suspend(); else audio.ac.resume();
  });

  var map = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Space: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
  window.addEventListener('keydown', function (e) {
    if (paused) { if (e.code === 'Escape') closeSheet(); return; }
    var m = map[e.code];
    if (m) { keys[m] = 1; initAudio(); e.preventDefault(); return; }
    if (e.code === 'KeyR') reset();
    else if (e.code === 'KeyE' && S.manual && car.gear < 6) car.gear++;
    else if (e.code === 'KeyQ' && S.manual && car.gear > 1) car.gear--;
    else if (e.code === 'Escape') openSheet();
  });
  window.addEventListener('keyup', function (e) { var m = map[e.code]; if (m) keys[m] = 0; });
  window.addEventListener('blur', function () { keys.up = keys.down = keys.left = keys.right = 0; });

  Array.prototype.forEach.call(document.querySelectorAll('.key'), function (b) {
    var kk = b.getAttribute('data-k');
    function on(e) { e.preventDefault(); keys[kk] = 1; b.classList.add('on'); initAudio(); try { b.setPointerCapture(e.pointerId); } catch (x) {} }
    function off() { keys[kk] = 0; b.classList.remove('on'); }
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
    b.addEventListener('lostpointercapture', off);
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });

  /* ---------- settings sheet ---------- */
  var sheet = $('sheet');
  function syncSheet() {
    $('setLayout').value = S.layout; $('setGhost').checked = S.ghost; $('setFps').checked = S.fps; $('setSound').checked = S.sound; $('setShadows').checked = S.shadows; $('setHq').checked = S.hq;
    $('setTrans').value = S.manual ? 'manual' : 'auto';
    $('bestInfo').textContent = best === null ? 'No lap set yet' : fmt(best);
  }
  function applyS() {
    $('fps').hidden = !S.fps;
    sun.castShadow = S.shadows;
    $('gearMode').textContent = S.manual ? 'Manual' : 'Auto';
    resize();
  }
  function openSheet() { paused = true; syncSheet(); sheet.hidden = false; keys.up = keys.down = keys.left = keys.right = 0; }
  function closeSheet() { paused = false; sheet.hidden = true; last = performance.now(); }
  $('btnSettings').addEventListener('click', openSheet);
  $('setDone').addEventListener('click', closeSheet);
  $('btnRestart').addEventListener('click', reset);
  $('btnLayout').addEventListener('click', function () {
    S.layout = app.getAttribute('data-layout') === 'land' ? 'port' : 'land';
    saveS(); $('setLayout').value = S.layout; resize();
    toast(S.layout === 'port' ? 'Portrait layout' : 'Landscape layout');
  });
  $('setLayout').addEventListener('change', function (e) { S.layout = e.target.value; saveS(); resize(); });
  $('setGhost').addEventListener('change', function (e) { S.ghost = e.target.checked; saveS(); });
  $('setFps').addEventListener('change', function (e) { S.fps = e.target.checked; saveS(); applyS(); });
  $('setSound').addEventListener('change', function (e) { S.sound = e.target.checked; saveS(); if (S.sound) initAudio(); });
  $('setShadows').addEventListener('change', function (e) { S.shadows = e.target.checked; saveS(); applyS(); });
  $('setHq').addEventListener('change', function (e) { S.hq = e.target.checked; saveS(); applyS(); });
  $('setTrans').addEventListener('change', function (e) { S.manual = e.target.value === 'manual'; saveS(); applyS(); });

  /* ---------- minimap ---------- */
  var mini = $('mini'), mg = mini.getContext('2d'), mbg = mk(300, 300), mscale = 1, mminX = 0, mmaxX = 0, mmaxZ = 0, mpad = 26;
  (function () {
    var minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
    P.forEach(function (p) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z); });
    mscale = Math.min((300 - 2 * mpad) / (maxX - minX), (300 - 2 * mpad) / (maxZ - minZ));
    mminX = minX; mmaxX = maxX; mmaxZ = maxZ;
    var offX = (300 - (maxX - minX) * mscale) / 2, offZ = (300 - (maxZ - minZ) * mscale) / 2;
    mini._ox = offX; mini._oz = offZ;
    var g = mbg.getContext('2d'); g.lineJoin = 'round'; g.lineCap = 'round';
    function path() { g.beginPath(); P.forEach(function (p, i) { var x = (maxX - p.x) * mscale + offX, y = (maxZ - p.z) * mscale + offZ; i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath(); }
    g.strokeStyle = 'rgba(255,255,255,0.92)'; g.lineWidth = 13; path(); g.stroke();
    g.globalCompositeOperation = 'destination-out'; g.lineWidth = 8.5; path(); g.stroke();
  })();
  function drawMini() {
    mg.clearRect(0, 0, 300, 300); mg.drawImage(mbg, 0, 0);
    var x = (mmaxX - car.x) * mscale + mini._ox, y = (mmaxZ - car.z) * mscale + mini._oz;
    if (ghostPos.on) {
      mg.fillStyle = '#6ae6ee'; mg.strokeStyle = '#fff'; mg.lineWidth = 2;
      mg.beginPath(); mg.arc((mmaxX - ghostPos.x) * mscale + mini._ox, (mmaxZ - ghostPos.z) * mscale + mini._oz, 6, 0, TAU); mg.fill(); mg.stroke();
    }
    mg.fillStyle = '#ffa629'; mg.strokeStyle = '#fff'; mg.lineWidth = 3;
    mg.beginPath(); mg.arc(x, y, 7, 0, TAU); mg.fill(); mg.stroke();
  }

  /* ---------- fps meter ---------- */
  var fpsAcc = { n: 0, t: 0, mn: 999, mx: 0 }, fpsHist = [], fpsG = $('fpsGraph').getContext('2d'), lastGraph = 0;
  function fpsTick(dt, now) {
    if (!S.fps || dt <= 0) return;
    var f = 1 / dt; fpsAcc.n++; fpsAcc.t += dt; fpsAcc.mn = Math.min(fpsAcc.mn, f); fpsAcc.mx = Math.max(fpsAcc.mx, f);
    if (fpsAcc.t >= 1) {
      var avg = Math.round(fpsAcc.n / fpsAcc.t);
      setText($('fpsText'), avg + ' FPS (' + Math.round(fpsAcc.mn) + '-' + Math.round(fpsAcc.mx) + ')');
      fpsHist.push(avg); if (fpsHist.length > 28) fpsHist.shift();
      fpsG.fillStyle = '#12243b'; fpsG.fillRect(0, 0, 112, 36);
      fpsG.fillStyle = '#6ae6ee';
      fpsHist.forEach(function (v, i) { var h = clamp(v / 75, 0.05, 1) * 34; fpsG.fillRect(i * 4, 36 - h, 3, h); });
      fpsAcc = { n: 0, t: 0, mn: 999, mx: 0 };
    }
  }

  /* ---------- hud ---------- */
  function setText(el, s) { if (el._t !== s) { el.textContent = s; el._t = s; } }
  function hud() {
    var kmh = Math.round(Math.abs(car.v) * 3.6);
    setText($('spd'), String(kmh));
    var target = 1000 + 7000 * rn(car.gear, car.v);
    car.rpm += (target - car.rpm) * Math.min(1, 0.016 * 12);
    var rp = clamp((car.rpm - 1000) / 7400, 0, 1);
    var bar = $('rpmBar'); bar.style.width = (8 + rp * 92).toFixed(1) + '%';
    bar.className = car.rpm > 7300 ? 'hot' : '';
    setText($('rpmTxt'), (Math.round(car.rpm / 50) * 50).toLocaleString('en-US') + ' rpm');
    setText($('gearBox'), car.v < -0.5 ? 'R' : String(car.gear));
    setText($('lapLbl'), 'Lap ' + lap);
    setText($('lapTime'), fmt(lapT));
    setText($('bestTime'), best === null ? '--:--.--' : fmt(best));
    var p = (car.idx > N * 0.9 && !passedHalf) ? 0 : car.idx / N;
    $('lapBar').style.width = (p * 100).toFixed(1) + '%';
    drawMini();
  }

  /* ---------- render ---------- */
  var sunOff = new THREE.Vector3(60, 90, 35);
  function render(dt) {
    updateGhost();
    carRoot.position.set(car.x, 0, car.z); carRoot.rotation.y = car.h;
    var ax = car.lastA || 0, yw = car.yaw || 0;
    car.roll += (clamp(-yw * car.v * 0.0016, -0.05, 0.05) - car.roll) * Math.min(1, dt * 6);
    car.pitch += (clamp(-ax * 0.004, -0.04, 0.04) - car.pitch) * Math.min(1, dt * 6);
    tilt.rotation.z = car.roll; tilt.rotation.x = car.pitch;
    car.spin += car.v * dt / 0.36;
    wheelSpin.forEach(function (w) { w.rotation.x = car.spin; });
    wheelsF.forEach(function (w) { w.rotation.y = -car.steer * 0.35; });

    camH += wrap(car.h - camH) * Math.min(1, dt * (car.v >= 0 ? 4.5 : 10));
    var sp = Math.abs(car.v), dist = 6.8 + sp * 0.012, hgt = 2.5 + sp * 0.004;
    camera.position.set(car.x - Math.sin(camH) * dist, hgt, car.z - Math.cos(camH) * dist);
    camera.lookAt(car.x + Math.sin(camH) * 9, 1.1, car.z + Math.cos(camH) * 9);
    var base = camera.aspect < 1 ? 78 : 62, fov = base + 11 * Math.min(1, sp / 80);
    if (Math.abs(camera.fov - fov) > 0.05) { camera.fov = fov; camera.updateProjectionMatrix(); }
    sky.position.copy(camera.position);
    sun.position.set(car.x + sunOff.x, sunOff.y, car.z + sunOff.z); sun.target.position.set(car.x, 0, car.z);
    renderer.render(scene, camera);
  }

  // Picks the HUD layout. If it differs from the screen's shape, the whole game is turned 90 degrees.
  function layout() {
    var bw = document.body.clientWidth || window.innerWidth, bh = document.body.clientHeight || window.innerHeight;
    var shape = bw >= bh ? 'land' : 'port';
    var want = S.layout === 'land' || S.layout === 'port' ? S.layout : shape;
    var rot = want !== shape, w = rot ? bh : bw, h = rot ? bw : bh, st = app.style;
    app.setAttribute('data-layout', want);
    if (rot) {
      st.position = 'absolute'; st.left = '0'; st.top = '0'; st.width = w + 'px'; st.height = h + 'px';
      st.transformOrigin = '0 0'; st.transform = 'translate(' + bw + 'px,0) rotate(90deg)';
    } else {
      st.position = 'relative'; st.left = ''; st.top = ''; st.width = '100%'; st.height = '100%';
      st.transformOrigin = ''; st.transform = 'none';
    }
    var u = want === 'land' ? Math.min(w / 100, h * 0.016) : Math.min(w / 60, h / 120);
    st.setProperty('--u', clamp(u, 3.6, 8).toFixed(2) + 'px');
  }
  function resize() {
    layout();
    var w = app.clientWidth || window.innerWidth, h = app.clientHeight || window.innerHeight;
    renderer.setPixelRatio(S.hq ? Math.min(window.devicePixelRatio || 1, 2) : 1);
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });
  if (window.ResizeObserver) new ResizeObserver(resize).observe(document.body);

  /* ---------- loop ---------- */
  var last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = (now - last) / 1000; last = now;
    if (!(dt > 0)) return;
    if (dt > 0.1) dt = 0.1;
    fpsTick(dt, now);
    if (!paused) {
      var n = Math.max(1, Math.ceil(dt / 0.01)), h = dt / n;
      for (var i = 0; i < n; i++) step(h);
    }
    render(dt); hud(); audioTick();
  }

  reset(); applyS(); syncSheet();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
